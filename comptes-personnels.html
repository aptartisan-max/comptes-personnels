<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Comptes perso">
<meta name="theme-color" content="#121212">
<title>Comptes personnels</title>
<style>
  :root{
    --bg:#121212; --card:#1c1c1e; --card2:#242427; --line:#2e2e32;
    --text:#f2f2f2; --muted:#9a9aa0; --green:#4caf7a; --danger:#e05a5a;
    --accent:#d4af37; --accent-soft:rgba(212,175,55,.16); --on-accent:#121212;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       padding:calc(16px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
  h1{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;text-align:center}

  /* onglets défilants */
  .tabs{display:flex;gap:6px;overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px;margin:14px 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:0 0 auto;min-width:76px;padding:9px 10px;border:none;border-radius:10px;background:none;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
  .tabs button .ic{font-size:18px;line-height:1}
  .tabs button .n{font-size:10px;font-weight:500;min-height:12px}
  .tabs button.active{background:var(--accent-soft);color:var(--accent)}
  .tabs button.add{color:var(--muted);border:1px dashed var(--line);min-width:64px}

  .month{display:flex;align-items:center;justify-content:space-between;margin:14px 0 18px}
  .month button{background:var(--card);border:1px solid var(--line);color:var(--accent);width:42px;height:42px;border-radius:50%;font-size:20px;cursor:pointer}
  .month span{font-size:20px;font-weight:600;text-transform:capitalize}

  .hero{background:linear-gradient(145deg,#1f1f22,#18181a);border:1px solid var(--line);border-radius:20px;padding:22px;text-align:center}
  .hero .lbl{color:var(--muted);font-size:13px}
  .hero .amt{font-size:40px;font-weight:700;margin:6px 0;color:var(--accent)}
  .hero .sub{font-size:13px;color:var(--muted)}
  .bar{height:8px;background:var(--card2);border-radius:6px;overflow:hidden;margin-top:14px}
  .bar div{height:100%;background:var(--green);width:0;transition:width .4s}
  .global{margin-top:12px;font-size:13px;color:var(--muted);text-align:center}
  .global b{color:var(--text)}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin:24px 0 10px;gap:10px}
  .toolbar h2{font-size:16px;display:flex;align-items:center;gap:8px}
  .toolbar h2 button{background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer}
  .toggle{font-size:13px;color:var(--muted);background:none;border:none;cursor:pointer;white-space:nowrap}
  .list{display:flex;flex-direction:column;gap:10px}
  .item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  .item.done{opacity:.45}
  .item.done .title{text-decoration:line-through}
  .check{width:26px;height:26px;border-radius:50%;border:2px solid var(--accent);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;background:none;color:#121212;font-size:15px;font-weight:700}
  .item.done .check{background:var(--green);border-color:var(--green)}
  .info{flex:1;min-width:0}
  .title{font-size:15px;word-break:break-word}
  .meta{font-size:12px;color:var(--muted);margin-top:2px}
  .price{font-weight:600;font-size:16px;white-space:nowrap}
  .acts{display:flex;gap:4px}
  .acts button{background:none;border:none;color:var(--muted);font-size:17px;cursor:pointer;padding:4px}
  .empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}

  .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));border:none;border-radius:30px;padding:15px 28px;font-size:16px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.5);cursor:pointer;white-space:nowrap;background:var(--accent);color:var(--on-accent)}

  .backup{display:flex;gap:10px;justify-content:center;margin-top:30px}
  .backup button,.backup label{font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}

  .ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .ov.open{display:flex}
  .sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto}
  .sheet h3{font-size:18px;margin-bottom:16px}
  .sheet label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
  .sheet input{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:13px;font-size:16px}
  .sheet input:focus{outline:none;border-color:var(--accent)}
  .row{display:flex;gap:10px;margin-top:20px}
  .row button{flex:1;padding:14px;border-radius:12px;border:none;font-size:16px;font-weight:600;cursor:pointer}
  .btn-cancel{background:var(--card2);color:var(--text)}
  .btn-ok{background:var(--accent);color:var(--on-accent)}
  .btn-del{display:block;width:100%;margin-top:14px;padding:12px;background:none;border:1px solid rgba(224,90,90,.4);color:var(--danger);border-radius:12px;font-size:15px;cursor:pointer}

  .swatches,.emojis{display:flex;flex-wrap:wrap;gap:8px}
  .swatches button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}
  .swatches button.sel{border-color:#fff}
  .emojis button{width:42px;height:42px;border-radius:10px;border:2px solid transparent;background:var(--card2);font-size:20px;cursor:pointer}
  .emojis button.sel{border-color:var(--accent)}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
</style>
</head>
<body>

<h1>Comptes personnels</h1>

<div class="tabs" id="tabs"></div>

<div class="month">
  <button id="prev" aria-label="Mois précédent">‹</button>
  <span id="monthLabel"></span>
  <button id="next" aria-label="Mois suivant">›</button>
</div>

<div class="hero">
  <div class="lbl" id="heroLbl"></div>
  <div class="amt" id="due">0,00 €</div>
  <div class="sub" id="sub"></div>
  <div class="bar"><div id="progress"></div></div>
</div>
<div class="global" id="global"></div>

<div class="toolbar">
  <h2><span id="listTitle"></span><button id="editCatBtn" aria-label="Modifier la catégorie">✎</button></h2>
  <button class="toggle" id="toggleDone"></button>
</div>
<div class="list" id="list"></div>

<div class="backup">
  <button id="exportBtn">⬇︎ Sauvegarder</button>
  <label>⬆︎ Restaurer<input type="file" id="importInput" accept=".json,application/json" hidden></label>
</div>

<button class="fab" id="addBtn">+ Ajouter</button>

<!-- Fenêtre : ajout / modification d'une ligne -->
<div class="ov" id="ov">
  <div class="sheet">
    <h3 id="formTitle"></h3>
    <label for="fTitle">Intitulé</label>
    <input id="fTitle">
    <label for="fAmount">Montant (€)</label>
    <input id="fAmount" inputmode="decimal" placeholder="0,00">
    <label for="fDate">Date</label>
    <input id="fDate" type="date">
    <div class="row">
      <button class="btn-cancel" id="cancelBtn">Annuler</button>
      <button class="btn-ok" id="saveBtn">Enregistrer</button>
    </div>
  </div>
</div>

<!-- Fenêtre : ajout / modification d'une catégorie -->
<div class="ov" id="catOv">
  <div class="sheet">
    <h3 id="catFormTitle">Nouvelle catégorie</h3>
    <label for="cName">Nom</label>
    <input id="cName" placeholder="Ex. Vacances, Voiture, Enfants…" maxlength="20">
    <label>Icône</label>
    <div class="emojis" id="emojis"></div>
    <label for="cEmoji">ou tape ton propre emoji</label>
    <input id="cEmoji" maxlength="4" placeholder="🙂">
    <label>Couleur</label>
    <div class="swatches" id="swatches"></div>
    <div class="row">
      <button class="btn-cancel" id="catCancel">Annuler</button>
      <button class="btn-ok" id="catSave">Enregistrer</button>
    </div>
    <button class="btn-del" id="catDelete">Supprimer cette catégorie</button>
  </div>
</div>

<script>
// ---- Catégories de base (avec leur vocabulaire propre) ----
const BUILTIN = {
  avances: { label:'Avances', icon:'↩︎', color:'#d4af37', one:'avance', fem:true,
             hero:'Encore à récupérer ce mois-ci', pending:'à récupérer',
             done:'remboursée', dones:'remboursées', ph:'Ex. Courses avancées pour Anna' },
  dettes:  { label:'Dettes', icon:'↪︎', color:'#e05a5a', one:'dette', fem:true,
             hero:'Encore à rembourser ce mois-ci', pending:'à rembourser',
             done:'réglée', dones:'réglées', ph:'Ex. Prêt de Marc' },
  cadeaux: { label:'Cadeaux', icon:'🎁', color:'#b07cd8', one:'cadeau', fem:false,
             hero:'Cadeaux à offrir ce mois-ci', pending:'à offrir',
             done:'offert', dones:'offerts', ph:'Ex. Anniversaire de Léa' },
  dons:    { label:'Dons', icon:'💝', color:'#5aa9e0', one:'don', fem:false,
             hero:'Dons à verser ce mois-ci', pending:'à verser',
             done:'versé', dones:'versés', ph:'Ex. Restos du Cœur' },
};
// Vocabulaire générique pour les catégories que tu crées
const GENERIC = { one:'ligne', fem:true, hero:'Encore à régler ce mois-ci', pending:'à régler',
                  done:'réglée', dones:'réglées', ph:'Intitulé' };

const COLORS = ['#d4af37','#e05a5a','#b07cd8','#5aa9e0','#4caf7a','#f08a3c','#e66fa8','#3cc1b5','#8d99ae','#c9a27e'];
const EMOJIS = ['🏖️','🚗','🏠','👶','🐶','🍽️','💊','🎓','✈️','🛒','💼','🎉','🧾','💡','📦','❤️'];

// ---- Données ----
const KEY = 'comptes-perso-v1';
let store;

function fresh(){
  const cats = Object.keys(BUILTIN).map(id => ({ id, label:BUILTIN[id].label, icon:BUILTIN[id].icon, color:BUILTIN[id].color }));
  const items = {}; cats.forEach(c => items[c.id] = []);
  return { cats, items };
}
function sanitize(d){
  if (!d || !Array.isArray(d.cats) || typeof d.items !== 'object') return null;
  const s = { cats: d.cats.filter(c => c && c.id && c.label), items: {} };
  if (!s.cats.length) return null;
  s.cats.forEach(c => s.items[c.id] = Array.isArray(d.items[c.id]) ? d.items[c.id] : []);
  return s;
}
function fromOld(old){ // anciennes versions : { avances:[], dettes:[], ... } ou tableau simple
  const s = fresh();
  if (Array.isArray(old)) s.items.avances = old;
  else if (old && typeof old === 'object') Object.keys(BUILTIN).forEach(k => { if (Array.isArray(old[k])) s.items[k] = old[k]; });
  return s;
}
try {
  store = sanitize(JSON.parse(localStorage.getItem(KEY)));
  if (!store) {
    const v2 = JSON.parse(localStorage.getItem('avances-dettes-v1'));
    const v1 = JSON.parse(localStorage.getItem('avances-v1'));
    store = v2 ? fromOld(v2) : (v1 ? fromOld(v1) : fresh());
  }
} catch(e) { store = fresh(); }

let tab = store.cats[0].id;
let showDone = true;
let editingId = null;
let editingCat = null;
let pickColor = COLORS[4], pickEmoji = EMOJIS[0];
const now = new Date();
let cur = { y: now.getFullYear(), m: now.getMonth() };

const $ = id => document.getElementById(id);
const euro = n => n.toLocaleString('fr-FR', { style:'currency', currency:'EUR' });
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e) {} };
const monthKey = (y,m) => `${y}-${String(m+1).padStart(2,'0')}`;
const toISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const list = () => store.items[tab];
const catOf = id => store.cats.find(c => c.id === id);
const words = id => Object.assign({}, GENERIC, BUILTIN[id] || {});
const hexToRgb = h => { const n = parseInt(h.slice(1), 16); return [(n>>16)&255, (n>>8)&255, n&255]; };
const textOn = h => { const [r,g,b] = hexToRgb(h); return (0.299*r + 0.587*g + 0.114*b) > 150 ? '#121212' : '#ffffff'; };

function render(){
  if (!catOf(tab)) tab = store.cats[0].id;
  const C = catOf(tab), W = words(tab);
  const [r,g,b] = hexToRgb(C.color);
  const root = document.documentElement.style;
  root.setProperty('--accent', C.color);
  root.setProperty('--accent-soft', `rgba(${r},${g},${b},.16)`);
  root.setProperty('--on-accent', textOn(C.color));

  $('tabs').innerHTML = store.cats.map(c => {
    const n = store.items[c.id].filter(a => !a.paid).length;
    return `<button data-tab="${c.id}" class="${c.id === tab ? 'active' : ''}">
      <span class="ic">${esc(c.icon || '•')}</span>${esc(c.label)}<span class="n">${n ? n + ' en attente' : ''}</span></button>`;
  }).join('') + `<button class="add" data-tab="__add"><span class="ic">＋</span>Catégorie<span class="n"></span></button>`;

  $('addBtn').textContent = BUILTIN[tab] ? `+ Ajouter ${W.fem ? 'une' : 'un'} ${W.one}` : '+ Ajouter';
  $('listTitle').textContent = C.label;
  $('heroLbl').textContent = W.hero;

  const mk = monthKey(cur.y, cur.m);
  $('monthLabel').textContent = new Date(cur.y, cur.m, 1).toLocaleDateString('fr-FR', { month:'long', year:'numeric' });

  const items = list().filter(a => a.date.startsWith(mk))
                      .sort((a,b) => (a.paid - b.paid) || b.date.localeCompare(a.date));
  const total = items.reduce((s,a) => s + a.amount, 0);
  const due = items.filter(a => !a.paid).reduce((s,a) => s + a.amount, 0);
  const nDue = items.filter(a => !a.paid).length;
  const nDone = items.length - nDue;

  $('due').textContent = euro(due);
  $('sub').textContent = items.length
    ? `${nDue} en attente · ${nDone} ${nDone > 1 ? W.dones : W.done} · total ${euro(total)}`
    : 'Rien ce mois-ci';
  $('progress').style.width = total ? ((total - due) / total * 100) + '%' : '0';

  const allDue = list().filter(a => !a.paid);
  const allSum = allDue.reduce((s,a) => s + a.amount, 0);
  $('global').innerHTML = allDue.length
    ? `Tous mois confondus : <b>${euro(allSum)}</b> ${W.pending} (${allDue.length})`
    : '';

  $('toggleDone').textContent = (showDone ? 'Masquer les ' : 'Afficher les ') + W.dones;

  const visible = showDone ? items : items.filter(a => !a.paid);
  $('list').innerHTML = visible.length ? visible.map(a => `
    <div class="item ${a.paid ? 'done' : ''}">
      <button class="check" data-act="toggle" data-id="${a.id}" aria-label="Marquer ${W.done}">${a.paid ? '✓' : ''}</button>
      <div class="info">
        <div class="title">${esc(a.title)}</div>
        <div class="meta">${new Date(a.date + 'T12:00').toLocaleDateString('fr-FR', { day:'numeric', month:'short' })}${a.paid ? ' · ' + W.done : ''}</div>
      </div>
      <div class="price">${euro(a.amount)}</div>
      <div class="acts">
        <button data-act="edit" data-id="${a.id}" aria-label="Modifier">✎</button>
        <button data-act="del" data-id="${a.id}" aria-label="Supprimer">🗑</button>
      </div>
    </div>`).join('')
    : `<div class="empty">${items.length ? 'Tout est réglé ce mois-ci 🎉' : 'Rien pour ce mois. Appuie sur le bouton en bas pour ajouter.'}</div>`;

  const active = document.querySelector('.tabs button.active');
  if (active) active.scrollIntoView({ block:'nearest', inline:'nearest' });
}

// ---- Onglets ----
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tab === '__add') return openCatForm(null);
  tab = b.dataset.tab; render();
});

// ---- Lignes ----
$('list').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const a = list().find(x => x.id === b.dataset.id); if (!a) return;
  if (b.dataset.act === 'toggle') { a.paid = !a.paid; save(); render(); }
  if (b.dataset.act === 'edit') openForm(a);
  if (b.dataset.act === 'del' && confirm(`Supprimer « ${a.title} » ?`)) {
    store.items[tab] = list().filter(x => x.id !== a.id); save(); render();
  }
});

function openForm(a){
  const W = words(tab), C = catOf(tab);
  editingId = a ? a.id : null;
  if (BUILTIN[tab]) {
    const art = { avances:"l'", dettes:'la ', cadeaux:'le ', dons:'le ' }[tab];
    $('formTitle').textContent = a ? `Modifier ${art}${W.one}` : `${W.fem ? 'Nouvelle' : 'Nouveau'} ${W.one}`;
  } else {
    $('formTitle').textContent = (a ? 'Modifier · ' : 'Ajouter · ') + C.label;
  }
  $('fTitle').value = a ? a.title : '';
  $('fTitle').placeholder = W.ph;
  $('fAmount').value = a ? String(a.amount).replace('.', ',') : '';
  const isCurMonth = cur.y === now.getFullYear() && cur.m === now.getMonth();
  $('fDate').value = a ? a.date : (isCurMonth ? toISO(now) : `${monthKey(cur.y, cur.m)}-01`);
  $('ov').classList.add('open');
  setTimeout(() => $('fTitle').focus(), 50);
}
const closeForm = () => $('ov').classList.remove('open');

$('saveBtn').onclick = () => {
  const title = $('fTitle').value.trim();
  const amount = parseFloat($('fAmount').value.replace(/\s/g,'').replace(',', '.'));
  const date = $('fDate').value;
  if (!title) return alert('Mets un intitulé.');
  if (isNaN(amount) || amount <= 0) return alert('Montant invalide.');
  if (!date) return alert('Choisis une date.');
  if (editingId) Object.assign(list().find(x => x.id === editingId), { title, amount, date });
  else list().push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), title, amount, date, paid:false });
  const [y, m] = date.split('-').map(Number); cur = { y, m: m - 1 };
  save(); closeForm(); render();
};
$('cancelBtn').onclick = closeForm;
$('ov').onclick = e => { if (e.target.id === 'ov') closeForm(); };
$('addBtn').onclick = () => openForm(null);

// ---- Catégories ----
function drawPickers(){
  $('swatches').innerHTML = COLORS.map(c =>
    `<button data-c="${c}" class="${c === pickColor ? 'sel' : ''}" style="background:${c}" aria-label="Couleur"></button>`).join('');
  $('emojis').innerHTML = EMOJIS.map(e =>
    `<button data-e="${e}" class="${e === pickEmoji ? 'sel' : ''}">${e}</button>`).join('');
}
$('swatches').onclick = e => { const b = e.target.closest('button'); if (!b) return; pickColor = b.dataset.c; drawPickers(); };
$('emojis').onclick = e => { const b = e.target.closest('button'); if (!b) return; pickEmoji = b.dataset.e; $('cEmoji').value = ''; drawPickers(); };

function openCatForm(c){
  editingCat = c ? c.id : null;
  $('catFormTitle').textContent = c ? 'Modifier la catégorie' : 'Nouvelle catégorie';
  $('cName').value = c ? c.label : '';
  pickColor = c ? c.color : COLORS[(store.cats.length) % COLORS.length];
  pickEmoji = c ? c.icon : EMOJIS[0];
  $('cEmoji').value = (c && !EMOJIS.includes(c.icon)) ? c.icon : '';
  $('catDelete').style.display = c && store.cats.length > 1 ? 'block' : 'none';
  drawPickers();
  $('catOv').classList.add('open');
  setTimeout(() => $('cName').focus(), 50);
}
const closeCat = () => $('catOv').classList.remove('open');

$('catSave').onclick = () => {
  const label = $('cName').value.trim();
  if (!label) return alert('Donne un nom à la catégorie.');
  const icon = $('cEmoji').value.trim() || pickEmoji;
  if (editingCat) {
    Object.assign(catOf(editingCat), { label, icon, color: pickColor });
  } else {
    const id = 'c' + Date.now().toString(36);
    store.cats.push({ id, label, icon, color: pickColor });
    store.items[id] = [];
    tab = id;
  }
  save(); closeCat(); render();
};
$('catDelete').onclick = () => {
  const c = catOf(editingCat); if (!c) return;
  const n = store.items[c.id].length;
  const msg = n ? `Supprimer « ${c.label} » et ses ${n} ligne${n > 1 ? 's' : ''} ? C'est définitif.` : `Supprimer « ${c.label} » ?`;
  if (!confirm(msg)) return;
  store.cats = store.cats.filter(x => x.id !== c.id);
  delete store.items[c.id];
  tab = store.cats[0].id;
  save(); closeCat(); render();
};
$('catCancel').onclick = closeCat;
$('catOv').onclick = e => { if (e.target.id === 'catOv') closeCat(); };
$('editCatBtn').onclick = () => openCatForm(catOf(tab));

// ---- Navigation ----
$('prev').onclick = () => { cur.m--; if (cur.m < 0) { cur.m = 11; cur.y--; } render(); };
$('next').onclick = () => { cur.m++; if (cur.m > 11) { cur.m = 0; cur.y++; } render(); };
$('toggleDone').onclick = () => { showDone = !showDone; render(); };

// ---- Sauvegarde ----
$('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(store, null, 2)], { type:'application/json' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `comptes-personnels-${toISO(new Date())}.json`;
  link.click();
};
$('importInput').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      const s = sanitize(d) || ((Array.isArray(d) || (d && Array.isArray(d.avances))) ? fromOld(d) : null);
      if (!s) throw 0;
      if (confirm('Remplacer les données actuelles par cette sauvegarde ?')) { store = s; tab = store.cats[0].id; save(); render(); }
    } catch(err) { alert('Fichier de sauvegarde invalide.'); }
  };
  r.readAsText(f);
  e.target.value = '';
};

render();
</script>
</body>
</html>
